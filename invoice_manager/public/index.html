<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發票報帳系統</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

/* ── Header ── */
.header {
    background: #2c4a6e;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
.header .spacer { flex: 1; }
.company-selector { display: flex; align-items: center; gap: 8px; }
.company-selector label { font-size: 13px; opacity: .85; }
.company-selector select {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 6px;
    color: #fff;
    padding: 5px 10px;
    font-size: 14px;
    cursor: pointer;
}
.company-selector select option { background: #2c4a6e; color: #fff; }
.usage-badge {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    opacity: .9;
}

/* ── Main ── */
.main { max-width: 1500px; margin: 24px auto; padding: 0 20px 64px; }

/* ── Drop zone ── */
.drop-zone {
    background: #fff;
    border: 2px dashed #b0bec5;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
}
.drop-zone:hover, .drop-zone.drag-over {
    border-color: #2c4a6e;
    background: #f0f4f9;
}
.drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop-zone .icon { color: #90a4ae; margin-bottom: 10px; display: flex; justify-content: center; }
.drop-zone p { color: #607d8b; font-size: 14px; }
.drop-zone p strong { color: #2c4a6e; }
.drop-zone .hint { font-size: 12px; margin-top: 6px; color: #90a4ae; }

.file-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.file-chip {
    background: #e8edf4;
    border-radius: 16px;
    padding: 4px 10px 4px 8px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.file-chip .remove { cursor: pointer; color: #90a4ae; font-size: 14px; line-height: 1; }
.file-chip .remove:hover { color: #e53935; }

.scan-bar { display: flex; justify-content: flex-end; margin-top: 12px; }
.btn {
    padding: 9px 22px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    font-weight: 600;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: #2c4a6e; color: #fff; }
.btn-primary:not(:disabled):hover { background: #3a5d87; }
.btn-success { background: #2e7d32; color: #fff; }
.btn-success:not(:disabled):hover { background: #388e3c; }
.btn-danger  { background: #c62828; color: #fff; }
.btn-outline {
    background: #fff;
    color: #2c4a6e;
    border: 1px solid #b0bec5;
}
.btn-outline:not(:disabled):hover { background: #f0f4f9; border-color: #2c4a6e; }
.invoice-type-toggle { display: flex; gap: 8px; }
.invoice-type-toggle .btn { padding: 9px 18px; }
.btn-outline-light {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,.5);
}
.btn-outline-light:not(:disabled):hover { background: rgba(255,255,255,.12); }

/* ── Progress ── */
.progress-bar-wrap {
    background: #e3e8ef;
    border-radius: 6px;
    height: 6px;
    margin-top: 10px;
    overflow: hidden;
    display: none;
}
.progress-bar-fill {
    height: 100%;
    background: #2c4a6e;
    border-radius: 6px;
    width: 0%;
    transition: width .3s;
}
.progress-label { font-size: 12px; color: #607d8b; margin-top: 4px; text-align: center; }

/* ── Results section ── */
.results-section { margin-top: 24px; display: none; }
.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.results-header h2 { font-size: 16px; color: #2c4a6e; }
.results-header .actions { display: flex; gap: 8px; }

/* ── Bulk case bar ── */
.bulk-case-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}
.bulk-case-bar input {
    padding: 7px 10px;
    border: 1px solid #d0d7e0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 220px;
}
.bulk-case-bar .btn { padding: 7px 16px; font-size: 13px; }

/* ── Table ── */
.table-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
thead th {
    background: #2c4a6e;
    color: #fff;
    padding: 10px 10px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
}
thead th:first-child { border-radius: 10px 0 0 0; }
thead th:last-child  { border-radius: 0 10px 0 0; }
tbody tr { border-bottom: 1px solid #e8edf4; }
tbody tr:last-child { border-bottom: none; }
tbody tr:nth-child(even) { background: #f7f9fc; }
tbody tr.has-flag { background: #fff8e1; }
tbody tr.has-flag:nth-child(even) { background: #fff3cd; }
tbody tr.failed-row { background: #ffebee; }
td { padding: 8px 10px; vertical-align: middle; }
td:first-child { width: 64px; }

.thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
.thumb-pdf { width: 72px; height: 72px; background: #e8edf4; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #6b8caf; }

.editable {
    min-width: 60px;
    padding: 3px 6px;
    border: 1px solid transparent;
    border-radius: 4px;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: inherit;
    width: 100%;
}
.editable:hover { border-color: #b0bec5; background: #fff; }
.editable:focus { border-color: #2c4a6e; background: #fff; box-shadow: 0 0 0 2px rgba(44,74,110,.15); }

.case-select {
    border: 1px solid #b0bec5;
    border-radius: 4px;
    padding: 3px 6px;
    font-family: inherit;
    font-size: 13px;
    background: #fff;
    min-width: 160px;
}

.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.flag-chip {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
    background: #ff8f00;
    color: #fff;
    white-space: nowrap;
}
.flag-chip.severity-high   { background: #c62828; }
.flag-chip.severity-medium { background: #78909c; }
.flag-chip.severity-info   { background: #1565c0; }

.amount-total {
    font-weight: 700 !important;
    font-size: 14px !important;
    color: #2c4a6e;
}
.delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #bdbdbd;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.delete-btn:hover { color: #e53935; background: #ffebee; }

/* ── Cost panel ── */
.cost-panel {
    background: #fff;
    border-radius: 10px;
    padding: 14px 20px;
    margin-top: 16px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    font-size: 13px;
    color: #546e7a;
}
.cost-panel .item strong { color: #2c4a6e; font-size: 14px; }
.cost-panel .item span { display: block; font-size: 11px; color: #90a4ae; margin-top: 2px; }

/* ── Toast ── */
.toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    z-index: 1000;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #2e7d32; }
.toast.error   { background: #c62828; }
.toast.info    { background: #1565c0; }

/* ── Sticky import bar ── */
.sticky-import-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    box-shadow: 0 -2px 12px rgba(0,0,0,.12);
    padding: 12px 24px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 1500;
}
.sticky-import-bar.show { display: flex; }
.sticky-import-bar span { font-size: 13px; color: #546e7a; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #dce3ec; }
.tab-btn {
    padding: 9px 24px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #607d8b;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: #2c4a6e; }
.tab-btn.active { color: #2c4a6e; border-bottom-color: #2c4a6e; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Sales form ── */
.sales-form {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.sales-form h2 { font-size: 15px; color: #2c4a6e; margin-bottom: 16px; }
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; color: #607d8b; font-weight: 600; }
.form-group input, .form-group select {
    padding: 8px 10px;
    border: 1px solid #d0d7e0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
}
.form-group input:focus, .form-group select:focus { border-color: #2c4a6e; box-shadow: 0 0 0 2px rgba(44,74,110,.12); }
.form-group.full { grid-column: 1 / -1; }
.form-actions { margin-top: 16px; display: flex; justify-content: flex-end; }

/* ── Case management modal ── */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    align-items: center;
    justify-content: center;
    z-index: 2000;
}
.modal-overlay.show { display: flex; }
.modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
}
.modal h2 { font-size: 15px; color: #2c4a6e; margin-bottom: 16px; }
.case-modal-list { overflow-y: auto; flex: 1; margin-bottom: 12px; border: 1px solid #e8edf4; border-radius: 8px; }
.case-modal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid #e8edf4;
    font-size: 13px;
}
.case-modal-row:last-child { border-bottom: none; }
.case-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
.case-add-row input {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid #d0d7e0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ── Expense templates ── */
.template-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.template-chips:empty { margin-bottom: 0; }
.template-chip {
    background: #e8edf4;
    border-radius: 16px;
    padding: 5px 8px 5px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background .15s;
}
.template-chip:hover { background: #dce3ec; }
.template-chip .label { color: #2c4a6e; font-weight: 600; }
.template-chip .remove { cursor: pointer; color: #90a4ae; font-size: 14px; line-height: 1; }
.template-chip .remove:hover { color: #e53935; }

/* ── Sales list ── */
.sales-list-section { margin-top: 20px; }
.sales-list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sales-list-header h3 { font-size: 14px; color: #2c4a6e; }
.sales-empty {
    text-align: center;
    padding: 32px;
    color: #90a4ae;
    font-size: 13px;
    background: #fff;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
.sales-empty svg { color: #cfd8e3; }

/* ── 窄螢幕 ── */
@media (max-width: 900px) {
    .header { flex-wrap: wrap; row-gap: 8px; }
    .header .spacer { flex-basis: 100%; height: 0; }
    .main { padding: 0 12px 64px; margin-top: 12px; }
    .form-grid, .form-grid.three { grid-template-columns: 1fr; }
    .scan-bar, .bulk-case-bar { flex-wrap: wrap; }
    .bulk-case-bar input { width: 100%; }
    .cost-panel { gap: 16px; }
    .modal { width: calc(100vw - 40px); }
}
</style>
</head>
<body>

<div class="header">
    <h1>發票報帳系統</h1>
    <div class="company-selector">
        <label>公司</label>
        <select id="companySelect">
            <option value="">載入中...</option>
        </select>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-outline-light" id="manageCasesBtn" style="padding:6px 14px;font-size:13px">管理案場</button>
    <div class="usage-badge" id="usageBadge">本月費用：載入中</div>
</div>

<div class="modal-overlay" id="caseModalOverlay">
    <div class="modal">
        <h2>管理案場 - <span id="caseModalCompany"></span></h2>
        <div class="case-modal-list" id="caseModalList"></div>
        <div class="case-add-row">
            <input type="text" id="caseModalNewName" placeholder="新增案場名稱">
            <button class="btn btn-outline" id="caseModalAddBtn">新增</button>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="caseModalCancelBtn">取消</button>
            <button class="btn btn-success" id="caseModalSaveBtn">儲存</button>
        </div>
    </div>
</div>

<div class="main">

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('purchase')">進項掃描</button>
        <button class="tab-btn"        onclick="switchTab('sales')">銷項輸入</button>
        <button class="tab-btn"        onclick="switchTab('expense')">固定支出</button>
    </div>

    <!-- 進項 tab -->
    <div id="tab-purchase" class="tab-panel active">

    <!-- 上傳區 -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.webp,.pdf">
        <div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
        <p><strong>拖曳發票至此</strong>，或點擊選取</p>
        <p class="hint">支援 JPG / PNG / WEBP / PDF</p>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <p class="progress-label" id="progressLabel"></p>
    <div class="scan-bar" style="justify-content:space-between">
        <button class="btn btn-outline" id="manualAddBtn">手動新增一筆</button>
        <button class="btn btn-primary" id="scanBtn" disabled>開始掃描</button>
    </div>

    <!-- 結果 -->
    <div class="results-section" id="resultsSection">
        <div class="results-header">
            <h2 id="resultsTitle">掃描結果</h2>
            <div class="actions">
                <button class="btn btn-success" id="exportBtn">匯入 Excel</button>
            </div>
        </div>
        <div class="bulk-case-bar">
            <input type="text" id="bulkCaseInput" list="bulk-case-list" placeholder="選擇或輸入案場" autocomplete="off">
            <datalist id="bulk-case-list"></datalist>
            <button class="btn btn-outline" id="bulkApplyCaseBtn">套用到已勾選</button>
        </div>
        <div class="table-wrap">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAllRows"></th>
                        <th>預覽</th>
                        <th>日期</th>
                        <th>店家抬頭</th>
                        <th>發票號碼</th>
                        <th>統編</th>
                        <th>品項</th>
                        <th>金額</th>
                        <th>稅額</th>
                        <th>總金額</th>
                        <th>案場</th>
                        <th>狀態</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <!-- 費用 -->
        <div class="cost-panel" id="costPanel"></div>
    </div>

    </div><!-- /tab-purchase -->

    <!-- 銷項 tab -->
    <div id="tab-sales" class="tab-panel">

        <!-- 輸入表單 -->
        <div class="sales-form">
            <h2>新增銷項發票</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="s-date">
                </div>
                <div class="form-group">
                    <label>發票號碼</label>
                    <input type="text" id="s-invoice-number" placeholder="AB12345678">
                </div>
                <div class="form-group">
                    <label>買受人名稱</label>
                    <input type="text" id="s-buyer-name" placeholder="選填">
                </div>
                <div class="form-group" id="s-buyer-tax-id-group" style="display:none">
                    <label>買受人統編</label>
                    <input type="text" id="s-buyer-tax-id" placeholder="8碼統編（必填）" maxlength="8">
                </div>
                <div class="form-group">
                    <label>發票類別</label>
                    <div class="invoice-type-toggle">
                        <button type="button" class="btn btn-primary" id="s-type-duplicate" onclick="setSalesInvoiceType('二聯')">二聯式</button>
                        <button type="button" class="btn btn-outline" id="s-type-triplicate" onclick="setSalesInvoiceType('三聯')">三聯式</button>
                    </div>
                </div>
                <div class="form-group full">
                    <label>品項</label>
                    <input type="text" id="s-items" placeholder="服務/商品內容">
                </div>
            </div>
            <div class="form-grid three" style="margin-top:12px">
                <div class="form-group">
                    <label>金額（未稅）</label>
                    <input type="number" id="s-amount" placeholder="0" min="0" oninput="calcSalesTax()">
                </div>
                <div class="form-group">
                    <label>稅額（5%）</label>
                    <input type="number" id="s-tax" placeholder="0" min="0" oninput="calcSalesTotal()">
                </div>
                <div class="form-group">
                    <label>總金額</label>
                    <input type="number" id="s-total" placeholder="0" min="0" readonly style="background:#f5f7fa">
                </div>
            </div>
            <div class="form-grid" style="margin-top:12px">
                <div class="form-group">
                    <label>案場名稱</label>
                    <input type="text" id="s-case" list="s-case-list" placeholder="選擇或輸入案場名稱" autocomplete="off">
                    <datalist id="s-case-list"></datalist>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="addSalesItem()">加入清單</button>
            </div>
        </div>

        <!-- 清單 -->
        <div class="sales-list-section">
            <div class="sales-list-header">
                <h3 id="salesListTitle">待匯入清單（0 張）</h3>
                <button class="btn btn-success" id="salesExportBtn" disabled onclick="exportSales()">匯入 Excel</button>
            </div>
            <div id="salesListWrap">
                <div class="sales-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>還沒有任何銷項發票，填寫上面表單並按「加入清單」</div>
            </div>
        </div>

    </div><!-- /tab-sales -->

    <!-- 固定支出 tab -->
    <div id="tab-expense" class="tab-panel">

        <!-- 輸入表單 -->
        <div class="sales-form">
            <h2>新增固定支出</h2>
            <div class="template-chips" id="expenseTemplates"></div>
            <div class="form-grid three">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="e-date">
                </div>
                <div class="form-group">
                    <label>類別</label>
                    <input type="text" id="e-category" list="e-category-list" placeholder="選擇或輸入類別" autocomplete="off">
                    <datalist id="e-category-list">
                        <option value="水費">
                        <option value="電費">
                        <option value="勞保費">
                        <option value="健保費">
                        <option value="勞退費">
                        <option value="中華電信iPad網路">
                        <option value="中華電信光世代+MOD">
                        <option value="高鐵費">
                        <option value="台鐵費">
                    </datalist>
                </div>
                <div class="form-group">
                    <label>金額</label>
                    <input type="number" id="e-amount" placeholder="0" min="0">
                </div>
                <div class="form-group full">
                    <label>備註</label>
                    <input type="text" id="e-note" placeholder="例如：7月電費、OOO 員工勞健保">
                </div>
            </div>
            <div class="form-actions" style="justify-content:space-between">
                <button class="btn btn-outline" id="saveTemplateBtn">存為範本</button>
                <button class="btn btn-primary" onclick="addExpenseItem()">加入清單</button>
            </div>
        </div>

        <!-- 清單 -->
        <div class="sales-list-section">
            <div class="sales-list-header">
                <h3 id="expenseListTitle">待匯入清單（0 筆）</h3>
                <button class="btn btn-success" id="expenseExportBtn" disabled onclick="exportExpenses()">匯入 Excel</button>
            </div>
            <div id="expenseListWrap">
                <div class="sales-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>還沒有任何固定支出，填寫上面表單並按「加入清單」</div>
            </div>
        </div>

    </div><!-- /tab-expense -->

</div>

<div class="toast" id="toast"></div>

<div class="sticky-import-bar" id="stickyImportBar">
    <span id="stickyImportLabel"></span>
    <button class="btn btn-success" id="stickyImportBtn">匯入 Excel</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────

let selectedFiles  = [];
let scanResults    = [];
let caseNames      = [];
let lastScanUsage  = null;

// ── Icons ──────────────────────────────────────────────────────────────────

const ICON_PDF   = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const ICON_TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
const ICON_EDIT  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_EMPTY = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>';

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
    try {
        const cfg = await fetch('/api/config').then(r => r.json());
        const sel = document.getElementById('companySelect');
        sel.innerHTML = cfg.companies.map(c => `<option value="${c}">${c}</option>`).join('');
        caseNames = await fetchCaseNames(sel.value);
        sel.addEventListener('change', async () => {
            caseNames = await fetchCaseNames(sel.value);
            renderTable();
            populateSalsCaseSelect();
        });
    } catch { toast('載入設定失敗', 'error'); }

    loadUsage();
}

async function fetchCaseNames(company) {
    try {
        const data = await fetch(`/api/cases?company=${encodeURIComponent(company)}`).then(r => r.json());
        const names = data.caseNames || [];
        window._caseNames = names;
        if (data.naishipSyncOk === false) toast('⚠️ 無法連線案件系統，目前僅顯示手動清單', 'info');
        return names;
    } catch { return []; }
}

async function loadUsage() {
    try {
        const u  = await fetch('/api/usage').then(r => r.json());
        const el = document.getElementById('usageBadge');
        el.textContent = `${u.monthKey} 累計：US$${u.cost_usd.toFixed(4)}（NT$${u.cost_twd}）`;
    } catch { /* silent */ }
}

// ── File selection ─────────────────────────────────────────────────────────

const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList  = document.getElementById('fileList');
const scanBtn   = document.getElementById('scanBtn');

fileInput.addEventListener('change', e => addFiles([...e.target.files]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
});

function addFiles(files) {
    const allowed = ['.jpg', '.jpeg', '.png', '.webp', '.pdf'];
    for (const f of files) {
        const ext = f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
        if (!allowed.includes(ext)) { toast(`不支援的格式：${f.name}`, 'error'); continue; }
        if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) selectedFiles.push(f);
    }
    renderFileList();
    fileInput.value = '';
}

function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderFileList();
}

function renderFileList() {
    fileList.innerHTML = selectedFiles.map((f, i) =>
        `<div class="file-chip">
            <span>${f.name}</span>
            <span class="remove" onclick="removeFile(${i})">×</span>
        </div>`
    ).join('');
    scanBtn.disabled = selectedFiles.length === 0;
}

// ── Scan ───────────────────────────────────────────────────────────────────

scanBtn.addEventListener('click', startScan);

async function startScan() {
    const company = document.getElementById('companySelect').value;
    if (!company) { toast('請先選擇公司', 'error'); return; }
    if (selectedFiles.length === 0) return;

    scanBtn.disabled = true;
    scanBtn.innerHTML = '<span class="spinner"></span>掃描中...';

    const progressWrap  = document.getElementById('progressWrap');
    const progressFill  = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    progressWrap.style.display = 'block';
    progressFill.style.width   = '10%';
    progressLabel.textContent  = `正在辨識 ${selectedFiles.length} 個檔案...`;

    const fd = new FormData();
    fd.append('company', company);
    for (const f of selectedFiles) fd.append('files', f);

    try {
        progressFill.style.width = '40%';
        const res  = await fetch('/api/scan', { method: 'POST', body: fd });
        progressFill.style.width = '90%';
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || '掃描失敗');

        scanResults   = data.results;
        lastScanUsage = data.usage;

        progressFill.style.width = '100%';
        setTimeout(() => { progressWrap.style.display = 'none'; }, 400);

        // Load case names from config
        const cfg  = await fetch('/api/config').then(r => r.json());
        const co   = cfg.companies.includes(company) ? company : cfg.companies[0];
        // case names fetched via separate endpoint not available yet
        // use empty for now - populated from config server side already in excel

        renderTable();
        renderCostPanel(data.usage, null);
        document.getElementById('resultsSection').style.display = 'block';
        document.getElementById('resultsTitle').textContent = `掃描結果（${scanResults.length} 張）`;
        document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });

        selectedFiles = [];
        renderFileList();
        loadUsage();
    } catch (err) {
        toast(err.message, 'error');
        progressWrap.style.display = 'none';
    } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = '開始掃描';
    }
}

// ── Table ──────────────────────────────────────────────────────────────────

function renderTable() {
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = '';

    for (let i = 0; i < scanResults.length; i++) {
        const r   = scanResults[i];
        const tr  = document.createElement('tr');
        const ext = (r.sourceFile || '').split('.').pop().toLowerCase();

        if (r.failed) {
            tr.classList.add('failed-row');
            tr.innerHTML = `
                <td></td>
                <td>${ext === 'pdf' ? `<div class="thumb-pdf">${ICON_PDF}</div>` : `<a href="/uploads/${r.sourceFile}" target="_blank"><img class="thumb" src="/uploads/${r.sourceFile}" onerror="this.style.display='none'"></a>`}</td>
                <td colspan="9" style="color:#c62828">${r.error}</td>
                <td><button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="manualFix(${i})">手動輸入</button></td>
                <td><button class="delete-btn" onclick="deleteRow(${i})">${ICON_TRASH}</button></td>`;
        } else {
            if (r.flags && r.flags.length > 0) tr.classList.add('has-flag');
            const caseOpts = caseNames.map(n => `<option value="${esc(n)}">`).join('');
            const previewHtml = !r.sourceFile
                ? `<div class="thumb-pdf">${ICON_EDIT}</div>`
                : (ext === 'pdf' ? `<div class="thumb-pdf">${ICON_PDF}</div>` : `<a href="/uploads/${r.sourceFile}" target="_blank"><img class="thumb" src="/uploads/${r.sourceFile}" onerror="this.style.display='none'"></a>`);
            tr.innerHTML = `
                <td><input type="checkbox" class="row-chk" data-idx="${i}"></td>
                <td>${previewHtml}</td>
                <td><input class="editable" value="${esc(r.date)}" onchange="updateField(${i},'date',this.value)" style="min-width:100px"></td>
                <td><input class="editable" value="${esc(r.store_name)}" onchange="updateField(${i},'store_name',this.value)" style="min-width:200px"></td>
                <td><input class="editable" value="${esc(r.invoice_number)}" onchange="updateField(${i},'invoice_number',this.value)" style="min-width:110px"></td>
                <td><input class="editable" value="${esc(r.tax_id)}" onchange="updateField(${i},'tax_id',this.value)" style="min-width:100px"></td>
                <td><input class="editable" value="${esc(r.items)}" onchange="updateField(${i},'items',this.value)" style="min-width:220px"></td>
                <td><input class="editable" type="number" value="${r.amount}" onchange="updateField(${i},'amount',+this.value)" style="min-width:100px;text-align:right"></td>
                <td><input class="editable" type="number" value="${r.tax}" onchange="updateField(${i},'tax',+this.value)" style="min-width:90px;text-align:right"></td>
                <td><input class="editable amount-total" type="number" value="${r.total}" onchange="updateField(${i},'total',+this.value)" style="min-width:100px;text-align:right"></td>
                <td><input class="editable case-select" list="case-dl-${i}" value="${esc(r.case_name)}" onchange="updateField(${i},'case_name',this.value)" placeholder="選擇或輸入案場" autocomplete="off"><datalist id="case-dl-${i}">${caseOpts}</datalist></td>
                <td><div class="flags">${(r.flags||[]).map(f=>`<span class="flag-chip ${flagSeverity(f)}">${f}</span>`).join('')}</div></td>
                <td><button class="delete-btn" onclick="deleteRow(${i})">${ICON_TRASH}</button></td>`;
        }
        tbody.appendChild(tr);
    }

    populateBulkCaseList();
    updateStickyBar();
}

function populateBulkCaseList() {
    const dl = document.getElementById('bulk-case-list');
    if (dl) dl.innerHTML = caseNames.map(n => `<option value="${esc(n)}">`).join('');
}

document.getElementById('checkAllRows').addEventListener('change', e => {
    document.querySelectorAll('.row-chk').forEach(cb => cb.checked = e.target.checked);
});

document.getElementById('bulkApplyCaseBtn').addEventListener('click', () => {
    const val = document.getElementById('bulkCaseInput').value.trim();
    if (!val) { toast('請先輸入或選擇案場', 'error'); return; }
    const checked = document.querySelectorAll('.row-chk:checked');
    if (checked.length === 0) { toast('請先勾選要套用的列', 'error'); return; }
    checked.forEach(cb => {
        const idx = +cb.dataset.idx;
        if (scanResults[idx] && !scanResults[idx].failed) scanResults[idx].case_name = val;
    });
    renderTable();
    toast(`已套用案場到 ${checked.length} 筆`, 'success');
});

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function flagSeverity(f) {
    if (f === '⚠金額為0' || f === '⚠請填寫店家名稱') return 'severity-high';
    if (f === '⚠自家公司') return 'severity-medium';
    if (f === '⚠手動輸入') return 'severity-info';
    return '';
}

function updateField(idx, field, value) {
    scanResults[idx][field] = value;
    const flags = scanResults[idx].flags || [];
    const hasFlag = flags.length > 0;
    const tr = document.getElementById('resultsBody').children[idx];
    if (tr) {
        tr.classList.toggle('has-flag', hasFlag);
        tr.classList.toggle('failed-row', !!scanResults[idx].failed);
    }
}

function deleteRow(idx) {
    scanResults.splice(idx, 1);
    renderTable();
    document.getElementById('resultsTitle').textContent = `掃描結果（${scanResults.length} 張）`;
}

function manualFix(idx) {
    const r = scanResults[idx];
    scanResults[idx] = {
        date: '', invoice_number: '', tax_id: '',
        store_name: '', items: '',
        amount: 0, tax: 0, total: 0,
        case_name: '', sourceFile: r.sourceFile,
        flags: ['⚠手動輸入'], failed: false
    };
    renderTable();
}

document.getElementById('manualAddBtn').addEventListener('click', () => {
    scanResults.push({
        date: '', invoice_number: '', tax_id: '',
        store_name: '', items: '',
        amount: 0, tax: 0, total: 0,
        case_name: '', sourceFile: null,
        flags: ['⚠手動輸入'], failed: false
    });
    renderTable();
    document.getElementById('resultsSection').style.display = 'block';
    document.getElementById('resultsTitle').textContent = `掃描結果（${scanResults.length} 張）`;
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
});

// ── Export ─────────────────────────────────────────────────────────────────

async function exportPurchase() {
    const company = document.getElementById('companySelect').value;
    const toExport = scanResults.filter(r => !r.failed);
    if (toExport.length === 0) { toast('沒有可匯入的發票', 'error'); return; }

    const btns = [document.getElementById('exportBtn'), document.getElementById('stickyImportBtn')];
    btns.forEach(b => { b.disabled = true; b.innerHTML = '<span class="spinner"></span>匯入中...'; });

    try {
        const res  = await fetch('/api/export', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ company, invoices: toExport })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const dupMsg = data.duplicates.length > 0 ? `，略過重複 ${data.skipped} 筆` : '';
        toast(`完成！新增 ${data.added} 筆${dupMsg}`, 'success');

        renderCostPanel(lastScanUsage, data);
        loadUsage();

        // 清空結果
        scanResults = [];
        renderTable();
        document.getElementById('resultsSection').style.display = 'none';
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btns.forEach(b => { b.disabled = false; b.textContent = '匯入 Excel'; });
        updateStickyBar();
    }
}

document.getElementById('exportBtn').addEventListener('click', exportPurchase);

// ── 案場管理 ────────────────────────────────────────────────────────────────

let modalCaseNames = [];

async function openCaseModal() {
    const company = document.getElementById('companySelect').value;
    if (!company) { toast('請先選擇公司', 'error'); return; }

    document.getElementById('caseModalCompany').textContent = company;
    try {
        const data = await fetch(`/api/cases?company=${encodeURIComponent(company)}`).then(r => r.json());
        modalCaseNames = data.caseNames || [];
        if (data.naishipSyncOk === false) {
            toast('⚠️ 無法連線案件系統，目前僅顯示手動清單', 'info');
        }
    } catch {
        modalCaseNames = [];
    }
    renderCaseModalList();
    document.getElementById('caseModalOverlay').classList.add('show');
}

function renderCaseModalList() {
    const wrap = document.getElementById('caseModalList');
    if (modalCaseNames.length === 0) {
        wrap.innerHTML = `<div class="sales-empty">${ICON_EMPTY}還沒有案場，在下面輸入名稱新增第一個</div>`;
        return;
    }
    wrap.innerHTML = modalCaseNames.map((n, i) => `
        <div class="case-modal-row">
            <span>${esc(n)}</span>
            <button class="delete-btn" onclick="removeCaseModalName(${i})">${ICON_TRASH}</button>
        </div>`).join('');
}

function addCaseModalName() {
    const input = document.getElementById('caseModalNewName');
    const name  = input.value.trim();
    if (!name) return;
    if (modalCaseNames.includes(name)) { toast('案場已存在', 'error'); return; }
    modalCaseNames.push(name);
    input.value = '';
    renderCaseModalList();
}

function removeCaseModalName(i) {
    modalCaseNames.splice(i, 1);
    renderCaseModalList();
}

function closeCaseModal() {
    document.getElementById('caseModalOverlay').classList.remove('show');
}

async function saveCaseModal() {
    const company = document.getElementById('companySelect').value;
    const btn = document.getElementById('caseModalSaveBtn');
    btn.disabled = true;
    try {
        const res = await fetch('/api/cases', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ company, caseNames: modalCaseNames })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        toast('案場清單已更新', 'success');
        closeCaseModal();
        caseNames = await fetchCaseNames(company);
        renderTable();
        populateSalsCaseSelect();
    } catch (err) {
        toast('儲存失敗：' + err.message, 'error');
    } finally {
        btn.disabled = false;
    }
}

document.getElementById('manageCasesBtn').addEventListener('click', openCaseModal);
document.getElementById('caseModalAddBtn').addEventListener('click', addCaseModalName);
document.getElementById('caseModalCancelBtn').addEventListener('click', closeCaseModal);
document.getElementById('caseModalSaveBtn').addEventListener('click', saveCaseModal);
document.getElementById('caseModalNewName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addCaseModalName(); }
});

// ── Cost Panel ─────────────────────────────────────────────────────────────

async function renderCostPanel(scanUsage, exportData) {
    const panel = document.getElementById('costPanel');
    if (!scanUsage) { panel.innerHTML = ''; return; }

    const monthData = await fetch('/api/usage').then(r => r.json()).catch(() => null);
    const added     = exportData ? exportData.added : '—';

    panel.innerHTML = `
        <div class="item">
            <strong>本次掃描費用</strong>
            <span>US$${scanUsage.cost_usd.toFixed(4)}（約 NT$${scanUsage.cost_twd}）</span>
        </div>
        <div class="item">
            <strong>本次 tokens</strong>
            <span>輸入 ${scanUsage.input_tokens.toLocaleString()} ／ 輸出 ${scanUsage.output_tokens.toLocaleString()}</span>
        </div>
        <div class="item">
            <strong>本次新增</strong>
            <span>${added} 筆發票</span>
        </div>
        ${monthData ? `
        <div class="item">
            <strong>${monthData.monthKey} 累計</strong>
            <span>${monthData.files_scanned} 個檔案，${monthData.invoices_added} 筆，US$${monthData.cost_usd.toFixed(4)}（NT$${monthData.cost_twd}）</span>
        </div>` : ''}
    `;
}

// ── Toast ──────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Tabs ───────────────────────────────────────────────────────────────────

const TAB_TITLES = { purchase: '進項掃描', sales: '銷項輸入', expense: '固定支出' };
let currentTab = 'purchase';

function switchTab(tab) {
    currentTab = tab;
    const order = ['purchase', 'sales', 'expense'];
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', order[i] === tab);
    });
    document.getElementById('tab-purchase').classList.toggle('active', tab === 'purchase');
    document.getElementById('tab-sales').classList.toggle('active', tab === 'sales');
    document.getElementById('tab-expense').classList.toggle('active', tab === 'expense');
    document.title = `發票報帳系統 - ${TAB_TITLES[tab]}`;
    if (tab === 'sales') populateSalsCaseSelect();
    updateStickyBar();
}

function updateStickyBar() {
    const bar   = document.getElementById('stickyImportBar');
    const label = document.getElementById('stickyImportLabel');
    let count = 0, text = '';

    if (currentTab === 'purchase') {
        count = scanResults.filter(r => !r.failed).length;
        text  = `${count} 筆進項待匯入`;
    } else if (currentTab === 'sales') {
        count = salesList.length;
        text  = `${count} 張銷項待匯入`;
    } else if (currentTab === 'expense') {
        count = expenseList.length;
        text  = `${count} 筆固定支出待匯入`;
    }

    if (count > 0) {
        label.textContent = text;
        bar.classList.add('show');
    } else {
        bar.classList.remove('show');
    }
}

document.getElementById('stickyImportBtn').addEventListener('click', () => {
    if (currentTab === 'purchase') exportPurchase();
    else if (currentTab === 'sales') exportSales();
    else if (currentTab === 'expense') exportExpenses();
});

// ── Sales ──────────────────────────────────────────────────────────────────

let salesList = [];
let salesInvoiceType = '二聯';

['s-date', 's-invoice-number', 's-buyer-name', 's-buyer-tax-id', 's-items', 's-amount', 's-tax', 's-total'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addSalesItem(); }
    });
});

function populateSalsCaseSelect() {
    const dl    = document.getElementById('s-case-list');
    const names = window._caseNames || [];
    dl.innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
}

function setSalesInvoiceType(type) {
    salesInvoiceType = type;
    document.getElementById('s-type-duplicate').classList.toggle('btn-primary', type === '二聯');
    document.getElementById('s-type-duplicate').classList.toggle('btn-outline', type !== '二聯');
    document.getElementById('s-type-triplicate').classList.toggle('btn-primary', type === '三聯');
    document.getElementById('s-type-triplicate').classList.toggle('btn-outline', type !== '三聯');
    document.getElementById('s-buyer-tax-id-group').style.display = type === '三聯' ? '' : 'none';
    if (type === '二聯') document.getElementById('s-buyer-tax-id').value = '';
}

function calcSalesTax() {
    const amount = parseFloat(document.getElementById('s-amount').value) || 0;
    const tax    = Math.round(amount * 0.05);
    document.getElementById('s-tax').value   = tax;
    document.getElementById('s-total').value = amount + tax;
}

function calcSalesTotal() {
    const amount = parseFloat(document.getElementById('s-amount').value) || 0;
    const tax    = parseFloat(document.getElementById('s-tax').value)    || 0;
    document.getElementById('s-total').value = amount + tax;
}

function addSalesItem() {
    const date          = document.getElementById('s-date').value;
    const invoice_number = document.getElementById('s-invoice-number').value.trim().toUpperCase().replace(/[\s\-]/g, '');
    const buyer_name    = document.getElementById('s-buyer-name').value.trim();
    const buyer_tax_id  = document.getElementById('s-buyer-tax-id').value.trim();
    const items         = document.getElementById('s-items').value.trim();
    const amount        = parseFloat(document.getElementById('s-amount').value) || 0;
    const tax           = parseFloat(document.getElementById('s-tax').value)    || 0;
    const total         = parseFloat(document.getElementById('s-total').value)  || 0;
    const case_name     = document.getElementById('s-case').value;

    if (!date)   { toast('請填入日期', 'error'); return; }
    if (total === 0) { toast('請填入金額', 'error'); return; }
    if (salesInvoiceType === '三聯' && !buyer_tax_id) {
        toast('三聯式發票請填入買受人統編', 'error');
        return;
    }

    if (invoice_number && salesList.find(i => i.invoice_number === invoice_number)) {
        toast(`發票號碼 ${invoice_number} 已在清單中`, 'error');
        return;
    }

    salesList.push({ date, invoice_number, buyer_name, buyer_tax_id, items, invoice_type: salesInvoiceType, amount, tax, total, case_name });
    renderSalesList();

    // 清空表單（保留日期和案場）
    document.getElementById('s-invoice-number').value = '';
    document.getElementById('s-buyer-name').value     = '';
    document.getElementById('s-buyer-tax-id').value   = '';
    document.getElementById('s-items').value          = '';
    document.getElementById('s-amount').value         = '';
    document.getElementById('s-tax').value            = '';
    document.getElementById('s-total').value          = '';
    document.getElementById('s-invoice-number').focus();
}

function deleteSalesItem(idx) {
    salesList.splice(idx, 1);
    renderSalesList();
}

function updateSalesField(idx, field, value) {
    salesList[idx][field] = value;
}

function renderSalesList() {
    const wrap  = document.getElementById('salesListWrap');
    const title = document.getElementById('salesListTitle');
    const btn   = document.getElementById('salesExportBtn');
    title.textContent = `待匯入清單（${salesList.length} 張）`;
    btn.disabled = salesList.length === 0;
    updateStickyBar();

    if (salesList.length === 0) {
        wrap.innerHTML = `<div class="sales-empty">${ICON_EMPTY}還沒有任何銷項發票，填寫上面表單並按「加入清單」</div>`;
        return;
    }

    const caseOpts = (window._caseNames || []).map(n => `<option value="${esc(n)}">`).join('');
    const rows = salesList.map((r, i) => `
        <tr>
            <td><input class="editable" value="${esc(r.date)}" onchange="updateSalesField(${i},'date',this.value)"></td>
            <td><input class="editable" value="${esc(r.invoice_number)}" onchange="updateSalesField(${i},'invoice_number',this.value)"></td>
            <td><input class="editable" value="${esc(r.buyer_name)}" onchange="updateSalesField(${i},'buyer_name',this.value)"></td>
            <td><input class="editable" value="${esc(r.buyer_tax_id)}" onchange="updateSalesField(${i},'buyer_tax_id',this.value)"></td>
            <td><input class="editable" value="${esc(r.items)}" onchange="updateSalesField(${i},'items',this.value)"></td>
            <td>${esc(r.invoice_type)}</td>
            <td><input class="editable" type="number" value="${r.amount}" onchange="updateSalesField(${i},'amount',+this.value)" style="text-align:right"></td>
            <td><input class="editable" type="number" value="${r.tax}" onchange="updateSalesField(${i},'tax',+this.value)" style="text-align:right"></td>
            <td><input class="editable amount-total" type="number" value="${r.total}" onchange="updateSalesField(${i},'total',+this.value)" style="text-align:right"></td>
            <td><input class="editable" list="s-list-case-dl-${i}" value="${esc(r.case_name)}" onchange="updateSalesField(${i},'case_name',this.value)"><datalist id="s-list-case-dl-${i}">${caseOpts}</datalist></td>
            <td><button class="delete-btn" onclick="deleteSalesItem(${i})">${ICON_TRASH}</button></td>
        </tr>`).join('');

    wrap.innerHTML = `
        <div class="table-wrap">
            <table style="table-layout:fixed">
                <colgroup>
                    <col style="width:100px"><col style="width:120px"><col style="width:200px"><col style="width:110px">
                    <col><col style="width:60px"><col style="width:100px"><col style="width:90px"><col style="width:100px"><col style="width:140px"><col style="width:50px">
                </colgroup>
                <thead><tr>
                    <th>日期</th><th>發票號碼</th><th>買受人名稱</th><th>買受人統編</th>
                    <th>品項</th><th>類別</th><th>金額</th><th>稅額</th><th>總金額</th><th>案場</th><th></th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

async function exportSales() {
    const company = document.getElementById('companySelect').value;
    if (!company) { toast('請先選擇公司', 'error'); return; }
    if (salesList.length === 0) return;

    const btns = [document.getElementById('salesExportBtn'), document.getElementById('stickyImportBtn')];
    btns.forEach(b => { b.disabled = true; b.innerHTML = '<span class="spinner"></span>匯入中...'; });

    try {
        const res  = await fetch('/api/sales', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ company, invoices: salesList })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const dupMsg = data.duplicates.length > 0 ? `，略過重複 ${data.skipped} 筆` : '';
        toast(`完成！新增 ${data.added} 張銷項發票${dupMsg}`, 'success');
        salesList = [];
        renderSalesList();
        loadUsage();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btns.forEach(b => { b.disabled = false; b.textContent = '匯入 Excel'; });
        updateStickyBar();
    }
}

// ── Expense (固定支出) ────────────────────────────────────────────────────

let expenseList = [];

['e-date', 'e-amount', 'e-note'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addExpenseItem(); }
    });
});

// ── 固定支出範本 ────────────────────────────────────────────────────────────

function loadExpenseTemplates() {
    try { return JSON.parse(localStorage.getItem('expenseTemplates') || '[]'); }
    catch { return []; }
}

function saveExpenseTemplates(list) {
    localStorage.setItem('expenseTemplates', JSON.stringify(list));
}

function renderExpenseTemplates() {
    const wrap = document.getElementById('expenseTemplates');
    const templates = loadExpenseTemplates();
    wrap.innerHTML = templates.map((t, i) => `
        <span class="template-chip">
            <span class="label" onclick="applyExpenseTemplate(${i})">${esc(t.category)} $${Number(t.amount).toLocaleString()}</span>
            <span class="remove" onclick="deleteExpenseTemplate(${i})">×</span>
        </span>`).join('');
}

function applyExpenseTemplate(i) {
    const t = loadExpenseTemplates()[i];
    if (!t) return;
    document.getElementById('e-category').value = t.category;
    document.getElementById('e-amount').value   = t.amount;
    document.getElementById('e-note').value     = t.note || '';
    if (!document.getElementById('e-date').value) {
        document.getElementById('e-date').value = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
    }
    document.getElementById('e-amount').focus();
}

function deleteExpenseTemplate(i) {
    const templates = loadExpenseTemplates();
    templates.splice(i, 1);
    saveExpenseTemplates(templates);
    renderExpenseTemplates();
}

function saveCurrentAsTemplate() {
    const category = document.getElementById('e-category').value.trim();
    const amount   = parseFloat(document.getElementById('e-amount').value) || 0;
    const note     = document.getElementById('e-note').value.trim();
    if (!category || amount === 0) { toast('請先填類別和金額再存為範本', 'error'); return; }

    const templates = loadExpenseTemplates();
    templates.push({ category, amount, note });
    saveExpenseTemplates(templates);
    renderExpenseTemplates();
    toast('已儲存為範本', 'success');
}

document.getElementById('saveTemplateBtn').addEventListener('click', saveCurrentAsTemplate);
renderExpenseTemplates();

function addExpenseItem() {
    const date     = document.getElementById('e-date').value;
    const category = document.getElementById('e-category').value.trim();
    const amount   = parseFloat(document.getElementById('e-amount').value) || 0;
    const note     = document.getElementById('e-note').value.trim();

    if (!date)     { toast('請填入日期', 'error'); return; }
    if (!category) { toast('請填入類別', 'error'); return; }
    if (amount === 0) { toast('請填入金額', 'error'); return; }

    expenseList.push({ date, category, amount, note });
    renderExpenseList();

    document.getElementById('e-amount').value = '';
    document.getElementById('e-note').value   = '';
    document.getElementById('e-category').focus();
}

function deleteExpenseItem(idx) {
    expenseList.splice(idx, 1);
    renderExpenseList();
}

function updateExpenseField(idx, field, value) {
    expenseList[idx][field] = value;
}

function renderExpenseList() {
    const wrap  = document.getElementById('expenseListWrap');
    const title = document.getElementById('expenseListTitle');
    const btn   = document.getElementById('expenseExportBtn');
    title.textContent = `待匯入清單（${expenseList.length} 筆）`;
    btn.disabled = expenseList.length === 0;
    updateStickyBar();

    if (expenseList.length === 0) {
        wrap.innerHTML = `<div class="sales-empty">${ICON_EMPTY}還沒有任何固定支出，填寫上面表單並按「加入清單」</div>`;
        return;
    }

    const categoryOpts = ['水費','電費','勞保費','健保費','勞退費','中華電信iPad網路','中華電信光世代+MOD','高鐵費','台鐵費']
        .map(c => `<option value="${esc(c)}">`).join('');
    const rows = expenseList.map((r, i) => `
        <tr>
            <td><input class="editable" value="${esc(r.date)}" onchange="updateExpenseField(${i},'date',this.value)"></td>
            <td><input class="editable" list="e-list-category-dl-${i}" value="${esc(r.category)}" onchange="updateExpenseField(${i},'category',this.value)"><datalist id="e-list-category-dl-${i}">${categoryOpts}</datalist></td>
            <td><input class="editable amount-total" type="number" value="${r.amount}" onchange="updateExpenseField(${i},'amount',+this.value)" style="text-align:right"></td>
            <td><input class="editable" value="${esc(r.note)}" onchange="updateExpenseField(${i},'note',this.value)"></td>
            <td><button class="delete-btn" onclick="deleteExpenseItem(${i})">${ICON_TRASH}</button></td>
        </tr>`).join('');

    wrap.innerHTML = `
        <div class="table-wrap">
            <table style="table-layout:fixed">
                <colgroup>
                    <col style="width:110px"><col style="width:160px"><col style="width:110px"><col><col style="width:50px">
                </colgroup>
                <thead><tr>
                    <th>日期</th><th>類別</th><th>金額</th><th>備註</th><th></th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

async function exportExpenses() {
    const company = document.getElementById('companySelect').value;
    if (!company) { toast('請先選擇公司', 'error'); return; }
    if (expenseList.length === 0) return;

    const btns = [document.getElementById('expenseExportBtn'), document.getElementById('stickyImportBtn')];
    btns.forEach(b => { b.disabled = true; b.innerHTML = '<span class="spinner"></span>匯入中...'; });

    try {
        const res  = await fetch('/api/expenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ company, expenses: expenseList })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        toast(`完成！新增 ${data.added} 筆固定支出`, 'success');
        expenseList = [];
        renderExpenseList();
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btns.forEach(b => { b.disabled = false; b.textContent = '匯入 Excel'; });
        updateStickyBar();
    }
}

// ── 離開頁面提醒 ────────────────────────────────────────────────────────────

window.addEventListener('beforeunload', e => {
    const hasUnsaved = scanResults.some(r => !r.failed) || salesList.length > 0 || expenseList.length > 0;
    if (hasUnsaved) {
        e.preventDefault();
        e.returnValue = '';
    }
});

// ── Start ──────────────────────────────────────────────────────────────────

init();
</script>
</body>
</html>
